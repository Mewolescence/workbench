<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#4f46e5;--primary-dark:#4338ca;--primary-light:#eef2ff;
  --bg:#f4f5fb;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e6e8f0;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;--radius:14px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.3}
h2{font-size:19px}h3{font-size:15.5px}

/* 登录 */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#6366f1,transparent 45%),radial-gradient(circle at 80% 70%,#0ea5e9,transparent 45%),linear-gradient(135deg,#1e1b4b,#312e81 55%,#4f46e5)}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:38px 34px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.login-logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);margin-bottom:18px;box-shadow:0 10px 22px rgba(99,102,241,.45)}
.login-title{font-size:21px;margin-bottom:6px}
.login-sub{color:var(--muted);font-size:13px;margin-bottom:26px}
.login-hint{margin-top:22px;padding-top:18px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--muted)}
.demo-rows{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.demo{border:1px solid var(--border);background:#fafbff;border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;font-size:13px;font-family:inherit;color:#374151;transition:.15s}
.demo:hover{border-color:#c7d2fe;background:var(--primary-light)}

/* 布局 */
.layout{display:flex;min-height:100vh}
.sidebar{width:238px;flex-shrink:0;background:linear-gradient(180deg,#1e1b4b,#312e81 55%,#4338ca);color:#c7d2fe;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#818cf8,#c084fc);display:grid;place-items:center;color:#fff;font-size:19px;flex-shrink:0}
.brand-name{color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px}
.brand-sub{font-size:11px;color:#a5b4fc;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:11px;border:none;background:transparent;color:#c7d2fe;font-size:13.5px;font-family:inherit;cursor:pointer;text-align:left;transition:.16s;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item.active{background:#fff;color:#4338ca;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.nav-icon{font-size:15px;width:18px;text-align:center}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.mini-user{display:flex;align-items:center;gap:10px;padding:10px 8px 14px}
.mu-name{color:#fff;font-size:13.5px;font-weight:600}
.mu-role{font-size:11.5px;color:#a5b4fc}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#e0e7ff,#c7d2fe);display:grid;place-items:center;font-size:17px;flex-shrink:0}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 26px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar h1{font-size:18px}
.top-actions{display:flex;align-items:center;gap:12px}
.role-chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;background:#f1f5f9;color:#475569}
.role-chip.admin{background:#fee2e2;color:#b91c1c}
.role-chip.leader{background:#fef3c7;color:#b45309}
.content{padding:24px 26px 60px;max-width:1240px;width:100%}

/* 通用组件 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.16s;white-space:nowrap}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.btn.primary:hover{background:var(--primary-dark)}
.btn.ghost{background:#fff;color:#374151;border:1px solid var(--border)}
.btn.ghost:hover{background:#f9fafb;border-color:#c7d2fe}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.block{width:100%}
.btn.ghost.block{background:rgba(255,255,255,.08);color:#e0e7ff;border-color:rgba(255,255,255,.2)}
.btn.ghost.block:hover{background:rgba(255,255,255,.18)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.row{display:flex;align-items:center}
.row.between{justify-content:space-between}
.row.gap{gap:10px;flex-wrap:wrap}
.sm{font-size:12.5px}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{font-size:13px;margin-top:3px}

.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge.green{background:#dcfce7;color:#15803d}
.badge.blue{background:#dbeafe;color:#1d4ed8}
.badge.amber{background:#fef3c7;color:#b45309}
.badge.gray{background:#f1f5f9;color:#475569}
.badge.red{background:#fee2e2;color:#b91c1c}
.badge.purple{background:#ede9fe;color:#6d28d9}

.bar{height:7px;background:#eef0f7;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#a78bfa);transition:width .4s}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-size:27px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.stat .unit{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}

.empty{padding:26px;text-align:center;color:#9ca3af;font-size:13px}

.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f1f5f9}
.list-row:last-child{border-bottom:none}
.lr-title{font-weight:600;font-size:13.5px}
.lr-sub{font-size:12px;color:var(--muted);margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:10px 12px;background:#f8fafc;color:var(--muted);font-size:12.5px;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:#374151}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;font-family:inherit;outline:none;background:#fff;transition:.15s;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.13)}
textarea{resize:vertical;min-height:88px;line-height:1.6}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--primary-light);color:#4338ca;font-weight:600}

.desc{color:var(--muted);font-size:13px;margin:10px 0 4px}
.metrics{margin-top:14px;display:flex;flex-direction:column;gap:11px}
.metric .row{font-size:12.5px;margin-bottom:5px}

.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:18px;overflow-x:auto}
.tab{border:none;background:transparent;padding:8px 15px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.tab:hover{background:#f5f6fb;color:var(--text)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.3)}

.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .18s ease}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 22px;border-bottom:1px solid var(--border)}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.icon-btn{border:none;background:#f3f4f6;width:30px;height:30px;border-radius:9px;cursor:pointer;color:#6b7280;font-size:14px}
.icon-btn:hover{background:#e5e7eb}

/* 课表网格 */
.tt-grid{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}
.tt-cell{padding:10px 4px;border-radius:8px;background:#f8fafc;border:1px solid var(--border);cursor:pointer;font-size:12.5px;transition:.15s;user-select:none}
.tt-cell.header{background:transparent;border:none;font-weight:700;color:var(--muted);cursor:default}
.tt-cell.busy{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;font-weight:600}
.tt-cell.free:hover{background:#e0e7ff;border-color:#a5b4fc}
.tt-cell.busy:hover{background:#fecaca;border-color:#f87171}

/* 开关 */
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.4s;border-radius:24px}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:white;transition:.4s;border-radius:50%}
input:checked + .slider{background-color:var(--primary)}
input:checked + .slider:before{transform:translateX(20px)}

@media(max-width:900px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;align-items:center;gap:4px}
  .brand{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav-item{white-space:nowrap;padding:8px 12px}
  .sidebar-footer{display:none}
  .content{padding:18px 14px 50px}
  .topbar{padding:14px 16px}
  .tt-grid{grid-template-columns:50px repeat(7,1fr);font-size:11px}
  .tt-cell{padding:8px 2px}
}
</style>
</head>

/* ================= 核心：Supabase 同步逻辑 ================= */
async function initApp() {
  try {
    // 从 Supabase 获取数据
    const { data, error } = await supabaseClient
      .from('app_data')
      .select('payload')
      .eq('id', 'main')
      .single();

    if (error || !data || !data.payload) {
      // 没数据初始化种子
      DB = seed();
      await pushToCloud();
    } else {
      DB = data.payload;
      // 兼容空对象的情况
      if (Object.keys(DB).length === 0) DB = seed();
    }

    // 清理旧排班
    const cutoff = new Date(); cutoff.setFullYear(cutoff.getFullYear()-2);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    DB.schedules = DB.schedules.filter(s => s.date >= cutoffStr);

    // 恢复登录态
    try{ SESSION=JSON.parse(sessionStorage.getItem(SKEY)||'null'); }catch(e){ SESSION=null; }
    if(SESSION) {
      const u = DB.users.find(x=>x.username===SESSION.username);
      SESSION = u || null;
      if(!SESSION) sessionStorage.removeItem(SKEY);
    }

    if(SESSION) renderApp(); else renderLogin();

  } catch (err) {
    console.error(err);
    document.getElementById('app').innerHTML = `
      <div class="login-wrap"><div class="login-card" style="text-align:center">
        <h2 style="color:var(--danger)">连接云端失败</h2>
        <p class="desc" style="margin:10px 0">请检查网络，或在代码中检查 Supabase URL 和 Key 是否正确。</p>
      </div></div>`;
  }
}

async function save() {
  if (!DB) return;
  await pushToCloud();
}

async function pushToCloud() {
  const { error } = await supabaseClient
    .from('app_data')
    .upsert({ id: 'main', payload: DB, updated_at: new Date() });
  
  if (error) {
    console.error('保存失败', error);
    alert('保存到云端失败，请检查网络！');
  }
}

  el.className='modal-mask';
  el.innerHTML=`<div class="modal ${wide?'wide':''}">
    <div class="modal-head"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn primary" id="modalOk">${okText}</button>
    </div></div>`;
  document.body.appendChild(el);
  el.querySelector('#modalOk').onclick=()=>{ if(onOk()!==false) closeModal(); };
  el.addEventListener('click',e=>{ if(e.target===el) closeModal(); });
}
function closeModal(){ document.querySelectorAll('.modal-mask').forEach(m=>m.remove()); }

function doLogin(){

  const user=DB.users.find(x=>x.username===u&&x.password===p);

  CURRENT='dashboard'; renderApp();
}

/* 工作台 */
function pageDashboard(){
  const u=SESSION;
  const myTasks=DB.tasks.filter(t=>t.assignee===u.name);
  const done=myTasks.filter(t=>t.status==='已完成').length;
  const rate=myTasks.length?Math.round(done/myTasks.length*100):0;
  const deptTasks=DB.tasks.filter(t=>t.dept===u.dept);
  const deptDone=deptTasks.filter(t=>t.status==='已完成').length;
  const deptRate=deptTasks.length?Math.round(deptDone/deptTasks.length*100):0;
  return `
  <div class="stats">
    <div class="stat"><div class="k">我的任务完成率</div><div class="v">${rate}<span class="unit">%</span></div><div class="bar" style="margin-top:11px"><i style="width:${rate}%"></i></div></div>
    <div class="stat"><div class="k">本部门任务完成率</div><div class="v">${deptRate}<span class="unit">%</span></div><div class="bar" style="margin-top:11px"><i style="width:${deptRate}%"></i></div></div>

  </div>

    <div class="card">
      <div class="card-head"><h3>我的待办任务</h3><button class="btn ghost sm" onclick="nav('tasks')">查看全部</button></div>
      ${myTasks.filter(t=>t.status!=='已完成').slice(0,5).map(t=>`
        <div class="list-row">
          <div class="lr-main"><div class="lr-title">${esc(t.title)}</div><div class="lr-sub">截止 ${esc(t.deadline||'未设置')}</div></div>
          <span class="badge ${t.priority==='高'?'red':t.priority==='中'?'amber':'gray'}">${esc(t.priority)}</span>
        </div>`).join('')||empty('暂无待办任务')}
    </div>
    <div class="card">
      <div class="card-head"><h3>本部门最新任务</h3></div>
      ${deptTasks.filter(t=>t.status!=='已完成').slice(0,5).map(t=>`
        <div class="list-row">
          <div class="lr-main"><div class="lr-title">${esc(t.title)}</div><div class="lr-sub">${esc(t.assignee)} · 截止 ${esc(t.deadline||'未设置')}</div></div>

  </div>`;
}

/* 活动 */
function pageActivities(){
  return `
  <div class="page-head">
    <div><h2>活动成效预期</h2><p class="muted">全员可见，部长/管理员可建立与填写成果。</p></div>

  </div>
  <div class="grid-2">
    ${DB.activities.map(a=>{
      const rows=a.metrics.map(m=>{
        const p=m.target?Math.min(100,Math.round(m.actual/m.target*100)):0;
        const color=p>=80?'linear-gradient(90deg,#10b981,#34d399)':p>=50?'linear-gradient(90deg,#f59e0b,#fbbf24)':'linear-gradient(90deg,#ef4444,#f87171)';
        const tc=p>=80?'#10b981':p>=50?'#f59e0b':'#ef4444';
        return `<div class="metric">
          <div class="row between sm"><span>${esc(m.name)}</span>
            <span class="muted">${m.actual} / ${m.target} · <b style="color:${tc}">${p}%</b></span></div>
          <div class="bar"><i style="width:${p}%;background:${color}"></i></div>
        </div>`;
      }).join('');
      return `<div class="card">
        <div class="row between" style="align-items:flex-start">
          <div><h3>${esc(a.name)}</h3><div class="muted sm" style="margin-top:4px">${esc(a.category)} · 负责人 ${esc(a.owner)} · ${esc(a.date)}</div></div>
          <span class="badge ${a.status==='已完成'?'green':a.status==='进行中'?'blue':'gray'}">${esc(a.status)}</span>
        </div>
        <p class="desc">${esc(a.desc||'')}</p>
        <div class="metrics">${rows||empty('未设置指标')}</div>
        ${isManager()?`<div class="row gap" style="margin-top:16px">
          <button class="btn ghost sm" onclick="editActual('${a.id}')">填写实际成果</button>

function activityForm(){
  showModal({title:'新建活动',okText:'创建',body:`
    <div class="field"><label>活动名称</label><input id="acName" placeholder="例如：迎新晚会"></div>
    <div class="row gap" style="align-items:flex-end">
      <div class="field" style="flex:1"><label>类别</label><input id="acCat" placeholder="文艺活动"></div>

function editActual(id){
  const a=DB.activities.find(x=>x.id===id); if(!a) return;
  const body=a.metrics.map((m,i)=>`
    <div class="row gap" style="margin-bottom:10px;align-items:center">
      <div style="flex:1;font-size:13.5px">${esc(m.name)} <span class="muted sm">（目标 ${m.target}）</span></div>
      <input type="number" id="act_${i}" value="${m.actual}" style="width:120px">
    </div>`).join('')+`
    <div class="field" style="margin-top:16px"><label>活动状态</label>
      <select id="actStatus">${['筹备中','进行中','已完成'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>`;
  showModal({title:'填写实际成果 · '+esc(a.name),body,onOk:()=>{
    a.metrics.forEach((m,i)=>{ m.actual=Number($('#act_'+i).value)||0; });
    a.status=$('#actStatus').value;
    refresh();
  }});
}

function formCreate(){
  showModal({title:'新建信息收集',okText:'发布',body:`
    <div class="field"><label>收集标题</label><input id="ifTitle" placeholder="例如：新成员信息登记"></div>

  `,onOk:()=>{
    const title=$('#ifTitle').value.trim();
    if(!title){ alert('请填写收集标题'); return false; }
    const fields=$('#ifFields').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    DB.infoForms.unshift({id:uid(),title,desc:$('#ifDesc').value.trim(),
      fields:fields.length?fields:['姓名'],createdBy:SESSION.name,deadline:$('#ifDeadline').value||''});
    refresh();
  }});
}
function formFill(id){
  const f=DB.infoForms.find(x=>x.id===id); if(!f) return;
  const mine=DB.infoSubs.find(s=>s.formId===id&&s.user===SESSION.name);
  const body=f.fields.map((fd,i)=>`<div class="field"><label>${esc(fd)}</label>
    <input id="ff_${i}" value="${mine?esc(mine.values[fd]||''):''}"></div>`).join('');
  showModal({title:esc(f.title),okText:'提交',body,onOk:()=>{
    const values={};
    f.fields.forEach((fd,i)=>{ values[fd]=$('#ff_'+i).value.trim(); });
    if(mine){ mine.values=values; mine.time=nowStr(); }
    else DB.infoSubs.push({id:uid(),formId:id,user:SESSION.name,values,time:nowStr()});
    refresh(); alert('提交成功！');
  }});
}
function formView(id){
  const f=DB.infoForms.find(x=>x.id===id); if(!f) return;
  const subs=DB.infoSubs.filter(s=>s.formId===id);
  const body=subs.length?`
    <div class="table-wrap"><table>
      <thead><tr><th>提交人</th>${f.fields.map(x=>`<th>${esc(x)}</th>`).join('')}<th>提交时间</th></tr></thead>
      <tbody>${subs.map(s=>`<tr><td><b>${esc(s.user)}</b></td>
        ${f.fields.map(x=>`<td>${esc(s.values[x]||'—')}</td>`).join('')}
        <td class="muted sm">${esc(s.time)}</td></tr>`).join('')}</tbody>
    </table></div>`:empty('暂无提交记录');
  showModal({title:'汇总 · '+esc(f.title),body,okText:'关闭',wide:true,onOk:()=>{}});
}

function taskUpdate(id){

  showModal({title:'更新任务 · '+esc(t.title),body:`
    <div class="field"><label>状态</label>

    refresh();
  }});

    DB.supplies.unshift({id:uid(),name,category:$('#suCat').value.trim()||'其他',

function supplyMove(id,delta){
  const s=DB.supplies.find(x=>x.id===id); if(!s) return;
  const next=s.available+delta;
  if(next<0){ alert('可用数量不足'); return; }
  if(next>s.total){ alert('归还超出总数'); return; }
  s.available=next; refresh();
}

/* 排班与课表 */
function pageSchedule(){
  const isMgr = isManager();
  return `
  <div class="page-head">
    <div><h2>排班与课表</h2><p class="muted">部门内部可见。成员录入课表，部长可根据空闲时间排班。</p></div>
  </div>
  <div class="tabs">
    ${isMgr ? `
      <button class="tab active" id="tab-query" onclick="switchSchTab('query')">空闲查询与排班</button>
      <button class="tab" id="tab-sch" onclick="switchSchTab('sch')">排班列表</button>
    ` : `
      <button class="tab active" id="tab-tt" onclick="switchSchTab('tt')">我的课表</button>
      <button class="tab" id="tab-sch" onclick="switchSchTab('sch')">我的排班</button>
    `}
  </div>
  <div id="sch-content">${isMgr ? renderQuery() : renderTimetable()}</div>`;
}
function switchSchTab(t){
  document.querySelectorAll('.tabs .tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  const c = document.getElementById('sch-content');
  if(t==='query') c.innerHTML = renderQuery();
  else if(t==='tt') c.innerHTML = renderTimetable();
  else c.innerHTML = renderSchList();
}
function renderQuery(){
  return `
  <div class="card" style="margin-bottom:20px">
    <h3 style="margin-bottom:14px">🔍 查本部门空闲人员</h3>
    <div class="row gap" style="align-items:flex-end; margin-bottom:16px">
      <div class="field" style="margin:0; flex:1"><label>选择星期</label>
        <select id="qWeek">${WEEKS.map(w=>`<option>${w}</option>`).join('')}</select></div>
      <div class="field" style="margin:0; flex:1"><label>选择时间段</label>
        <select id="qPart">${DAY_PARTS.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <button class="btn primary" onclick="doQuery()">查询空闲</button>
    </div>
    <div id="queryResult"></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>已排班次</h3>
      <button class="btn primary sm" onclick="scheduleForm()">+ 新增排班</button></div>
    ${renderSchList(true)}
  </div>`;
}
function doQuery(){
  const w=$('#qWeek').value, p=$('#qPart').value;
  const slot = w+'-'+p;
  const myDeptUsers = DB.users.filter(u=>u.dept===SESSION.dept && u.role!=='admin' && u.name!==SESSION.name);
  const available = [], busy = [], noData = [];
  myDeptUsers.forEach(u=>{
    const tt = DB.timetables.find(t=>t.user===u.name);
    if(!tt){ noData.push(u); }
    else if(tt.busySlots.includes(slot)){ busy.push(u); }
    else { available.push(u); }
  });
  let html = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">`;
  html += `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:16px">
    <h4 style="color:#15803d;margin-bottom:10px">🟢 空闲 (${available.length})</h4>
    ${available.length?available.map(u=>`<span class="chip" style="margin:4px">${esc(u.name)}</span>`).join(''):'<div class="sm muted">无</div>'}
  </div>`;
  html += `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:16px">
    <h4 style="color:#b91c1c;margin-bottom:10px">🔴 有课 (${busy.length})</h4>
    ${busy.length?busy.map(u=>`<span class="chip" style="margin:4px;background:#fee2e2;color:#b91c1c">${esc(u.name)}</span>`).join(''):'<div class="sm muted">无</div>'}
  </div>`;
  if(noData.length){
    html += `<div style="grid-column:span 2;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:16px">
      <h4 style="color:var(--muted);margin-bottom:10px">⚪ 未录入课表 (${noData.length})</h4>
      ${noData.map(u=>`<span class="chip" style="margin:4px;background:#f1f5f9;color:#64748b">${esc(u.name)}</span>`).join('')}
    </div>`;
  }
  html += `</div>`;
  html += `<div style="margin-top:16px;text-align:right">
    <button class="btn primary" onclick="scheduleForm('${w}','${p}','${available.map(u=>u.name).join(',')}')">使用空闲人员排班</button>
  </div>`;
  $('#queryResult').innerHTML = html;
}
function renderTimetable(){
  const tt = DB.timetables.find(t=>t.user===SESSION.name) || {busySlots:[]};
  let html = `<div class="card">
    <div class="row between" style="margin-bottom:14px">
      <h3>我的课表（点击格子标记“有课”）</h3>
      <button class="btn primary sm" onclick="saveTimetable()">保存课表</button>
    </div>
    <div class="tt-grid">
      <div class="tt-cell header"></div>
      ${WEEKS.map(w=>`<div class="tt-cell header">${w}</div>`).join('')}
      ${DAY_PARTS.map(p=>`
        <div class="tt-cell header">${p}</div>
        ${WEEKS.map(w=>{
          const isBusy = tt.busySlots.includes(w+'-'+p);
          return `<div class="tt-cell ${isBusy?'busy':'free'}" data-slot="${w}-${p}" onclick="toggleSlot(this)">${isBusy?'有课':'空闲'}</div>`;
        }).join('')}
      `).join('')}
    </div>
    <p class="muted sm" style="margin-top:14px">提示：如果某时段有课或，请点击将其标记为“有课”。</p>
  </div>`;
  return html;
}
function toggleSlot(el){
  const slot = el.dataset.slot;
  if(el.classList.contains('busy')) {
    el.classList.remove('busy'); el.classList.add('free'); el.textContent = '空闲';
  } else {
    el.classList.add('busy'); el.classList.remove('free'); el.textContent = '有课';
  }
}
function saveTimetable(){
  const slots = [];
  document.querySelectorAll('.tt-cell.busy').forEach(el=>slots.push(el.dataset.slot));
  const existing = DB.timetables.find(t=>t.user===SESSION.name);
  if(existing) { existing.busySlots = slots; }
  else { DB.timetables.push({user:SESSION.name, dept:SESSION.dept, busySlots:slots}); }
  save(); alert('课表已保存！');
}
function renderSchList(inCard=false){
  const schs = DB.schedules.filter(s=>s.dept===SESSION.dept).sort((a,b)=>a.date.localeCompare(b.date));
  if(!schs.length) return empty('暂无排班');
  const groups = {};
  schs.forEach(s=>{ (groups[s.date]=groups[s.date]||[]).push(s); });
  let html = '';
  for(let d in groups){
    html += `<div style="margin-bottom:20px">
      <div class="row between" style="margin-bottom:10px"><h3>📅 ${esc(d)}</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>班次时间</th><th>人员</th><th>地点</th><th>备注</th><th>操作</th></tr></thead>
        <tbody>${groups[d].map(s=>`<tr>
          <td><b>${esc(s.shift)}</b></td>
          <td>${s.members.map(m=>`<span class="chip">${esc(m)}</span>`).join('')}</td>
          <td>${esc(s.place||'—')}</td>
          <td class="sm muted">${esc(s.note||'—')}</td>
          <td><button class="btn ghost sm danger" onclick="delRow('schedules','${s.id}')">删</button></td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }
  return html;
}
function scheduleForm(defW='', defP='', defMembers=''){
  showModal({title:'新增排班',okText:'添加',body:`
    <div class="field"><label>日期</label><input id="shDate" type="date"></div>
    <div class="field">
      <label>班次时间段</label>
      <select id="shShift" style="margin-bottom:8px">
        ${SHIFT_OPTIONS.map(opt=>`<option value="${opt}">${opt}</option>`).join('')}
        <option value="custom">自定义输入...</option>
      </select>
      <input id="shCustomShift" placeholder="例如：08:30 - 11:30" style="display:none">
    </div>
    <div class="field"><label>值班人员（逗号分隔）</label><input id="shMembers" value="${defMembers}" placeholder="王小明,陈雨欣"></div>
    <div class="field"><label>地点</label><input id="shPlace" value="办公室"></div>
    <div class="field"><label>备注</label><input id="shNote" placeholder="选填"></div>
  `,onOk:()=>{
    const date=$('#shDate').value;
    const selectVal = $('#shShift').value;
    const customVal = $('#shCustomShift').value.trim();
    const shift = selectVal === 'custom' ? customVal : selectVal;
    if(!date||!shift){ alert('请填写日期与班次时间'); return false; }
    const finalShift = defW ? `${defW} ${shift}` : shift;
    DB.schedules.push({id:uid(),dept:SESSION.dept,date,shift:finalShift,
      members:$('#shMembers').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
      place:$('#shPlace').value.trim(),note:$('#shNote').value.trim()});
    DB.schedules.sort((a,b)=>a.date.localeCompare(b.date));
    refresh();
  }});
  setTimeout(() => {
    const sel = document.getElementById('shShift');
    const custom = document.getElementById('shCustomShift');
    if(sel && custom) {
      sel.addEventListener('change', () => {
        if(sel.value === 'custom') {
          custom.style.display = 'block'; custom.focus();
        } else { custom.style.display = 'none'; }
      });
    }
  }, 50);
}

    <div class="field"><label>初始密码</label><input id="uPwd" value="123456"></div>
  `,onOk:()=>{
    const name=$('#uName').value.trim();
    const username=$('#uUsername').value.trim();
    if(!name||!username){ alert('姓名和账号必填'); return false; }
    if(DB.users.some(u=>u.username===username)){ alert('账号已存在'); return false; }
    DB.users.push({
      username, password:$('#uPwd').value.trim()||'123456', name,
      dept:$('#uDept').value, role:$('#uRole').value, canManageSupplies:false
    });
    refresh();
  }});
}
function resetPwd(username){
  if(!confirm('确定将该成员的密码重置为 123456 吗？')) return;
  const u=DB.users.find(x=>x.username===username);
  if(u){ u.password='123456'; save(); alert('密码已重置为 123456'); }
}
function toggleSupplyPermission(username){
  const u=DB.users.find(x=>x.username===username);
  if(u){ u.canManageSupplies=!u.canManageSupplies; save(); }
}
function delUser(username){
  if(!confirm('确定删除该成员吗？此操作不可撤销。')) return;
  DB.users=DB.users.filter(x=>x.username!==username);
  refresh();
}
function delRow(coll,id){
  if(!confirm('确定删除该记录吗？')) return;
  DB[coll]=DB[coll].filter(x=>x.id!==id);
  refresh();
}

/* ================= 启动 ================= */
initApp(); // 启动异步加载

</script>
</body>
</html>
